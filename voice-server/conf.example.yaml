# Momo 专用模板；首次启动复制为 conf.yaml，不会覆盖已有配置。
system_config:
  conf_version: 'v1.2.1'
  host: '127.0.0.1'
  port: 12393
  config_alts_dir: 'characters'
  tool_prompts: {}
character_config:
  conf_name: 'Momo'
  conf_uid: 'momo_default'
  live2d_model_name: 'momo'
  character_name: 'Momo'
  human_name: '你'
  avatar: ''
  persona_prompt: |
    你是 Momo，一只温柔、自然、有点俏皮的桌面小伙伴。用中文认真倾听用户。
    默认用一到三句简短、适合朗读的话回答，不要使用 Markdown、表情标签或括号动作。
    不挖苦用户，不假装已经控制了硬件。用户需要帮助时给出清楚实用的建议。
  agent_config:
    conversation_agent_choice: 'basic_memory_agent'
    agent_settings:
      basic_memory_agent:
        llm_provider: 'openai_compatible_llm'
        faster_first_response: true
        segment_method: 'pysbd'
        use_mcpp: false
        mcp_enabled_servers: []
    llm_configs:
      openai_compatible_llm:
        base_url: '${MOMO_LLM_BASE_URL}'
        llm_api_key: '${MOMO_LLM_API_KEY}'
        model: '${MOMO_LLM_MODEL}'
        temperature: 0.7
        interrupt_method: 'user'
  asr_config:
    asr_model: 'sherpa_onnx_asr'
    sherpa_onnx_asr:
      model_type: 'sense_voice'
      sense_voice: './models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/model.int8.onnx'
      tokens: './models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/tokens.txt'
      num_threads: 4
      provider: 'cpu'
      use_itn: true
  tts_config:
    tts_model: 'edge_tts'
    edge_tts:
      voice: 'zh-CN-XiaoxiaoNeural'
  vad_config:
    vad_model: null
  tts_preprocessor_config:
    remove_special_char: true
    ignore_brackets: true
    ignore_parentheses: true
    ignore_asterisks: true
    ignore_angle_brackets: true
    translator_config:
      translate_audio: false
      translate_provider: 'deeplx'
